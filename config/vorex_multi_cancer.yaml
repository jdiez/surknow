domain: "Multi-Cancer Early Detection"
description: "Landscape of companies, technologies, and clinical programs pursuing early-stage cancer detection across multiple cancer types simultaneously (MCED)"

references:
  foundational:
    - url: "https://www.nature.com/articles/s41586-023-06542-6"
      title: "Multi-cancer early detection via cfDNA methylation"
      type: "review_paper"
      notes: "Grail/Galleri foundational science — cfDNA methylation-based MCED"
    - url: "https://www.cancer.gov/research/annual-plan/scientific-topics/early-detection"
      title: "NCI Early Detection Research"
      type: "overview"
      notes: "Federal research priorities for early cancer detection"

  terminology:
    - url: "https://www.cancer.gov/publications/dictionaries/cancer-terms"
      title: "NCI Cancer Terms Dictionary"
      type: "glossary"

  prior_art:
    - url: "https://clinicaltrials.gov/search?term=multi-cancer+early+detection"
      title: "ClinicalTrials.gov — MCED trials"
      type: "database"
      notes: "Active MCED clinical programs — sponsors, endpoints, populations"
    - url: "https://patents.google.com/?q=multi-cancer+early+detection+liquid+biopsy"
      title: "Google Patents — MCED liquid biopsy"
      type: "database"
      notes: "Patent landscape for MCED technologies"

tools:
  generic:
    - name: "web_search"
      type: "web_search"
      provider: "tavily"
      priority: 1

  field_specific:
    - name: "pubmed"
      type: "api"
      uri: "https://eutils.ncbi.nlm.nih.gov/entrez/eutils/"
      domains: ["biomedical", "oncology", "diagnostics", "publications"]
      priority: 10
      rate_limit: 3
    - name: "clinical_trials"
      type: "api"
      uri: "https://clinicaltrials.gov/api/v2/"
      domains: ["clinical", "trials", "drugs", "diagnostics"]
      priority: 9
    - name: "semantic_scholar"
      type: "api"
      uri: "https://api.semanticscholar.org/graph/v1/"
      api_key_env: "S2_API_KEY"
      domains: ["academic", "papers", "kol"]
      priority: 7

  mcp_servers: []

