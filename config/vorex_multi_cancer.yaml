agent_config:
  domain_analyst:
    extra_instructions:
      - "Focus on companies with active MCED programs — not single-cancer diagnostics"
      - "Distinguish between commercially launched tests and pipeline/clinical-stage"
      - "Capture regulatory status (FDA breakthrough, CE-IVD, etc.) as entity metadata"
  entity_extractor:
    confidence_threshold: 0.7
    extra_instructions:
      - "For companies: capture stage (public/private), funding, key partnerships"
      - "For clinical trials: capture NCT number, phase, enrollment, primary endpoint"
      - "For KOLs: capture institution, H-index, role (PI, advisor, founder)"
      - "For patents: capture assignee, filing date, claims summary"
      - "For conferences: capture frequency, typical MCED presentations, key sessions"
